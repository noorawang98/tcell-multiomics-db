name: Site build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 站点文件在仓库根目录；构建工具与数据库在 _curated/
      - name: Verify site files are in place
        run: |
          for f in index.html catalog.html guideline.html 404.html .nojekyll \
                   assets/app.css assets/site.js assets/downloads.js \
                   data/datasets.json data/categories.json data/downloads.json; do
            test -f "$f" || { echo "缺少 $f"; exit 1; }
          done
          test "$(ls pages/*.html | wc -l)" = "11" || { echo "类别页应为 11 个"; exit 1; }
          echo "站点文件齐备"

      - name: Verify database-driven build reproduces the site
        working-directory: _curated
        run: |
          DSH_REPO_NAME="${{ github.event.repository.name }}" bash build_site.sh
          python3 - <<'PY'
          import json, os
          d = json.load(open("site/data/datasets.json", encoding="utf-8"))
          c = json.load(open("site/data/categories.json", encoding="utf-8"))
          m = json.load(open("site/data/meta.json", encoding="utf-8"))
          assert len(d) == m["n_ds"] == 134, (len(d), m["n_ds"])
          assert len(c) == 11
          assert {x["id"] for x in c} == {k for r in d for k in r["dis"]}
          for r in d:
              assert r["acc"].startswith("GSE")
          blob = json.dumps(d, ensure_ascii=False)
          for bad in ["/home/", "password", "api_key", "BEGIN PRIVATE KEY", "ssh-rsa"]:
              assert bad not in blob, bad
          print("导出 JSON 校验通过：", len(d), "数据集 /", len(c), "类别")
          PY

      - name: Verify download manifest is safe (no guessed URLs)
        run: |
          python3 - <<'PY'
          import json, os
          p = "data/downloads.json"
          if not os.path.exists(p):
              print("无 downloads.json，跳过（网页会提示暂无可验证下载链接）")
              raise SystemExit(0)
          d = json.load(open(p, encoding="utf-8"))
          ds = d.get("datasets", {})
          off = 0
          for acc, r in ds.items():
              g = r.get("geo", {})
              files = g.get("files", [])
              # 只允许官方 GEO 地址；不可核实的记录不得带文件
              for f in files:
                  assert f["u"].startswith("https://ftp.ncbi.nlm.nih.gov/geo/series/"), f["u"]
                  assert "/" not in f["n"], f["n"]
              if g.get("state") == "unavailable":
                  assert not files, acc
              if r.get("sra", {}).get("available"):
                  assert r["sra"].get("n_runs") and r["sra"].get("study"), acc
              off += 1
          st = d.get("stats", {})
          print(f"下载清单校验通过：{len(ds)} 个数据集 · 已核实 {st.get('verified')} · "
                f"不可核实 {st.get('unavailable')} · 文件 {st.get('n_files')}")
          PY
