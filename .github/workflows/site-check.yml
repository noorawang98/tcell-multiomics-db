name: Site build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 站点在仓库根目录；构建工具与数据库在 _curated/
      - name: Verify committed site files
        run: |
          for f in index.html catalog.html guideline.html 404.html .nojekyll \
                   assets/app.css assets/site.js assets/downloads.js \
                   data/datasets.json data/categories.json data/downloads.json; do
            test -f "$f" || { echo "缺少 $f"; exit 1; }
          done
          n=$(ls pages/*.html | wc -l)
          echo "类别页数量: $n"
          test "$n" = "11" || { echo "类别页应为 11 个"; exit 1; }
          echo "站点文件齐备"

      # 用 catalog.sqlite 重新生成 JSON（输出到 _curated/site/data）
      - name: Rebuild JSON from catalog.sqlite
        working-directory: _curated
        run: python3 export_json.py --site site --repo-name "${{ github.event.repository.name }}"

      - name: Validate exported JSON
        working-directory: _curated
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("site/data/datasets.json", encoding="utf-8"))
          c = json.load(open("site/data/categories.json", encoding="utf-8"))
          m = json.load(open("site/data/meta.json", encoding="utf-8"))
          assert len(d) == m["n_ds"] == 134, (len(d), m["n_ds"])
          assert len(c) == 11, len(c)
          assert {x["id"] for x in c} == {k for r in d for k in r["dis"]}
          blob = json.dumps(d, ensure_ascii=False)
          for bad in ["/home/", "password", "api_key", "BEGIN PRIVATE KEY", "ssh-rsa"]:
              assert bad not in blob, bad
          print("导出 JSON 校验通过:", len(d), "数据集 /", len(c), "类别")
          PY

      # 页面一致性：仓库根的页面与其数据必须自洽（行数、类别数、下载清单统计）
      - name: Validate committed pages against their data
        run: |
          python3 - <<'PY'
          import json, os, re

          ds = json.load(open("data/datasets.json", encoding="utf-8"))
          cats = json.load(open("data/categories.json", encoding="utf-8"))
          dl = json.load(open("data/downloads.json", encoding="utf-8"))
          assert len(cats) == 11
          assert len(dl["datasets"]) == dl["stats"]["n"] == 133
          verified = sum(1 for r in dl["datasets"].values() if r["geo"].get("files"))
          assert verified == dl["stats"]["verified"], (verified, dl["stats"]["verified"])

          pages = ["index.html", "catalog.html", "guideline.html", "404.html"] + \
                  ["pages/" + f for f in sorted(os.listdir("pages"))]
          assert len(pages) == 15, len(pages)

          for p in pages:
              t = open(p, encoding="utf-8").read()
              for ph in ["{INLINE_JS}", "{titleattr}", "{navbase}", "{dlbar}"]:
                  assert ph not in t, (p, ph)
              # 除纯静态 404 页外，其余页面都必须带内嵌 manifest 与文案表
              if p != "404.html":
                  assert 'id="dsh-manifest"' in t and 'id="dsh-i18n"' in t, p
              # 每个页面都要引用存在的资源
              for m in re.findall(r'(?:href|src)="((?:\.\./|\./)?assets/[^"]+)"', t):
                  rel = m.replace("../", "").replace("./", "")
                  if rel.endswith("icons/sprite.svg"):
                      continue
                  assert os.path.exists(rel), (p, rel)

          # 首页必须包含 11 个类别卡片的数据入口，目录页必须能加载下载模块
          idx = open("index.html", encoding="utf-8").read()
          assert 'id="cat-grid"' in idx, "首页缺疾病类别栅格"
          cat = open("catalog.html", encoding="utf-8").read()
          assert 'id="dl-bar"' in cat and 'id="dl-panel"' in cat and "assets/downloads.js" in cat
          print("页面自洽性检查通过:", len(pages), "页 · 资源引用有效 · 无占位符残留")
          PY
